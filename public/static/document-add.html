<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Бақайдгирии ҳуҷҷат — EDMS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
  <a class="skip-link" href="#main">Гузариш ба мундариҷа</a>
  <header>
    <nav class="navbar navbar-expand-lg app-nav" aria-label="Меню асосӣ">
      <div class="container">
        <a class="navbar-brand fw-bold" href="documents.html">EDMS</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Кушодани меню">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="documents.html">Ҳуҷҷатҳо</a></li>
            <li class="nav-item"><a class="nav-link" href="document.html">Корти ҳуҷҷат</a></li>
            <li class="nav-item"><a class="nav-link" href="document-add.html" aria-current="page">Бақайдгирӣ</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>
  <main id="main" class="container py-4">
    <h1 class="h3 mb-3">Бақайдгирии ҳуҷҷат</h1>
    <form id="doc-create-form" class="panel" method="post" action="/documents/create" novalidate aria-label="Шакли бақайдгирӣ">
      <div class="row g-3">
        <div class="col-12 col-md-6">
          <label class="form-label required" for="title">Сарлавҳа</label>
          <input class="form-control" id="title" name="title" type="text" required minlength="4" maxlength="120" aria-describedby="title-help title-error">
          <div class="form-text" id="title-help">Мухтасар, аз 4 то 120 аломат.</div>
          <div class="invalid-feedback" id="title-error"></div>
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label required" for="type">Намуд</label>
          <select class="form-select" id="type" name="type" required aria-describedby="type-error">
            <option value="">Интихоб кунед</option>
            <option value="incoming">Воридотӣ</option>
            <option value="outgoing">Содиротӣ</option>
            <option value="internal">Дохилӣ</option>
          </select>
          <div class="invalid-feedback" id="type-error"></div>
        </div>
        <div class="col-12 col-md-6 col-lg-3">
          <label class="form-label" for="imp">Аҳамият</label>
          <select class="form-select" id="imp" name="priority">
            <option value="normal">Муқаррарӣ</option>
            <option value="low">Паст</option>
            <option value="high">Муҳим</option>
          </select>
        </div>
        <div class="col-12 col-md-6 col-lg-3">
          <label class="form-label required" for="doc-date">Санаи ҳуҷҷат</label>
          <input class="form-control" id="doc-date" name="doc_date" type="date" required aria-describedby="doc-date-error">
          <div class="invalid-feedback" id="doc-date-error"></div>
        </div>
        <div class="col-12 col-md-6 col-lg-3">
          <label class="form-label required" for="dl">Мӯҳлати иҷро</label>
          <input class="form-control" id="dl" name="due_date" type="date" required aria-describedby="dl-error">
          <div class="invalid-feedback" id="dl-error"></div>
        </div>
        <div class="col-12 col-md-6 col-lg-3">
          <label class="form-label" for="file">Файл</label>
          <input class="form-control" id="file" name="attachment" type="file" accept=".pdf,.doc,.docx,.png,.jpg">
        </div>
        <div class="col-12">
          <label class="form-label" for="desc">Тавсиф</label>
          <textarea class="form-control" id="desc" name="description" rows="4" maxlength="300" aria-describedby="desc-error"></textarea>
          <div class="invalid-feedback" id="desc-error"></div>
        </div>
      </div>
      <div class="d-flex flex-wrap gap-2 mt-4">
        <button class="btn btn-primary" type="submit">Сабт кардан</button>
        <a class="btn btn-outline-secondary" href="documents.html">Бекор кардан</a>
      </div>
    </form>
  </main>
  <footer class="app-footer py-3">
    <div class="container">© 2026 EDMS — Низоми электронии ҳуҷҷатгардиш</div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script type="module" src="../assets/js/app.js"></script>
</body>
</html>
